version: '3.9'

# PostHog Analytics and Experimentation Platform
# This file extends the main docker-compose.yml with PostHog services

services:
  # PostHog Web Application
  posthog:
    image: posthog/posthog:latest
    container_name: kaizen-posthog
    environment:
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-insecure-secret-key-change-in-production}
      SITE_URL: ${POSTHOG_SITE_URL:-http://localhost:8000}
      DATABASE_URL: postgres://posthog:posthog@posthog-postgres:5432/posthog
      REDIS_URL: redis://posthog-redis:6379
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: false
      KAFKA_HOSTS: posthog-kafka:9092
      OBJECT_STORAGE_ENABLED: false
      DISABLE_SECURE_SSL_REDIRECT: true
      IS_BEHIND_PROXY: false
      TRUST_ALL_PROXIES: false
    ports:
      - "8000:8000"
    depends_on:
      posthog-postgres:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
    networks:
      - kaizen-network
      - posthog-network
    volumes:
      - posthog-data:/var/lib/posthog
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostHog Worker for async tasks
  posthog-worker:
    image: posthog/posthog:latest
    container_name: kaizen-posthog-worker
    command: ./bin/start-worker
    environment:
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-insecure-secret-key-change-in-production}
      SITE_URL: ${POSTHOG_SITE_URL:-http://localhost:8000}
      DATABASE_URL: postgres://posthog:posthog@posthog-postgres:5432/posthog
      REDIS_URL: redis://posthog-redis:6379
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: false
      KAFKA_HOSTS: posthog-kafka:9092
      OBJECT_STORAGE_ENABLED: false
    depends_on:
      posthog-postgres:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
    networks:
      - posthog-network
    volumes:
      - posthog-data:/var/lib/posthog

  # PostHog Plugins Server
  posthog-plugins:
    image: posthog/posthog:latest
    container_name: kaizen-posthog-plugins
    command: ./bin/start-plugins
    environment:
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-insecure-secret-key-change-in-production}
      DATABASE_URL: postgres://posthog:posthog@posthog-postgres:5432/posthog
      REDIS_URL: redis://posthog-redis:6379
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      KAFKA_HOSTS: posthog-kafka:9092
    depends_on:
      posthog-postgres:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
    networks:
      - posthog-network

  # PostgreSQL for PostHog metadata
  posthog-postgres:
    image: postgres:16-alpine
    container_name: kaizen-posthog-postgres
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
      POSTGRES_DB: posthog
    volumes:
      - posthog-postgres-data:/var/lib/postgresql/data
    networks:
      - posthog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog -d posthog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for PostHog caching
  posthog-redis:
    image: redis:7-alpine
    container_name: kaizen-posthog-redis
    command: redis-server --maxmemory 500mb --maxmemory-policy allkeys-lru
    volumes:
      - posthog-redis-data:/data
    networks:
      - posthog-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse for analytics data
  posthog-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: kaizen-posthog-clickhouse
    environment:
      CLICKHOUSE_DB: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: posthog
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - posthog-clickhouse-data:/var/lib/clickhouse
      - ./scripts/posthog/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./scripts/posthog/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    networks:
      - posthog-network
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka for event streaming
  posthog-kafka:
    image: bitnami/kafka:3.6
    container_name: kaizen-posthog-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@posthog-kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://posthog-kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: true
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - posthog-kafka-data:/bitnami/kafka
    networks:
      - posthog-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka coordination (if needed for older Kafka versions)
  posthog-zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: kaizen-posthog-zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: yes
      ZOO_ENABLE_AUTH: no
    volumes:
      - posthog-zookeeper-data:/bitnami/zookeeper
    networks:
      - posthog-network
    profiles:
      - zookeeper  # Only start if explicitly requested

networks:
  posthog-network:
    driver: bridge
  kaizen-network:
    external: true

volumes:
  posthog-data:
  posthog-postgres-data:
  posthog-redis-data:
  posthog-clickhouse-data:
  posthog-kafka-data:
  posthog-zookeeper-data: