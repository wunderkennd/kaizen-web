[package]
name = "kaizen-shared"
version = "0.1.0"
edition = "2021"

[dependencies]
# PostHog analytics
posthog-rs = "0.2.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Environment variables
dotenv = "0.15"

# Logging
tracing = "0.1"

# UUID generation
uuid = { version = "1.5", features = ["v4", "serde"] }

[dev-dependencies]
# Testing
mockall = "0.12"
tokio-test = "0.4"