[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
env =
    POSTHOG_ENABLED=false
    POSTHOG_PROJECT_API_KEY=phc_test_key
    POSTHOG_HOST=http://localhost:8000